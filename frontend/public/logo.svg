<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 107" width="64" height="64">
  <defs>
    <!-- Gradients for a modern, sleek tech aesthetic -->
    <linearGradient id="bubbleBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3082" />
      <stop offset="100%" stop-color="#1452D9" />
    </linearGradient>
    <linearGradient id="bubbleFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#007BFF" />
    </linearGradient>
  </defs>

  <!-- Left/Back Chat Bubble -->
  <g transform="translate(5, 5)">
    <path d="M 37.5 0 C 16.8 0 0 14.5 0 32.5 C 0 42.4 5.1 51.3 13.2 57.2 L 9.5 71.5 L 26.5 65.9 C 30 66.9 33.7 67.5 37.5 67.5 C 58.2 67.5 75 53 75 32.5 C 75 12 58.2 0 37.5 0 Z" fill="url(#bubbleBack)" />
    <!-- Typing Indicator Dots -->
    <circle cx="25" cy="34" r="5" fill="#ffffff" opacity="0.6" />
    <circle cx="50" cy="34" r="5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Right/Front Chat Bubble -->
  <!-- The stroke creates a clean cutout effect where it overlaps the back bubble -->
  <g transform="translate(45, 30)">
    <path d="M 37.5 0 C 16.8 0 0 14.5 0 32.5 C 0 53 16.8 67.5 37.5 67.5 C 41.3 67.5 45 66.9 48.5 65.9 L 65.5 71.5 L 61.8 57.2 C 69.9 51.3 75 42.4 75 32.5 C 75 12 58.2 0 37.5 0 Z" fill="url(#bubbleFront)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <circle cx="25" cy="34" r="5" fill="#ffffff" />
    <circle cx="50" cy="34" r="5" fill="#ffffff" />
  </g>
</svg>
